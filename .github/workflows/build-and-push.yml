
name: Build, Scan and Push Online Boutique Images

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scan-push:
    name: Build, Scan and Push ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: adservice
            context: ./src/adservice
            dockerfile: ./src/adservice/Dockerfile

          - service: cartservice
            context: ./src/cartservice/src
            dockerfile: ./src/cartservice/src/Dockerfile

          - service: checkoutservice
            context: ./src/checkoutservice
            dockerfile: ./src/checkoutservice/Dockerfile

          - service: currencyservice
            context: ./src/currencyservice
            dockerfile: ./src/currencyservice/Dockerfile

          - service: emailservice
            context: ./src/emailservice
            dockerfile: ./src/emailservice/Dockerfile

          - service: frontend
            context: ./src/frontend
            dockerfile: ./src/frontend/Dockerfile

          - service: loadgenerator
            context: ./src/loadgenerator
            dockerfile: ./src/loadgenerator/Dockerfile

          - service: paymentservice
            context: ./src/paymentservice
            dockerfile: ./src/paymentservice/Dockerfile

          - service: productcatalogservice
            context: ./src/productcatalogservice
            dockerfile: ./src/productcatalogservice/Dockerfile

          - service: recommendationservice
            context: ./src/recommendationservice
            dockerfile: ./src/recommendationservice/Dockerfile

          - service: shippingservice
            context: ./src/shippingservice
            dockerfile: ./src/shippingservice/Dockerfile

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: local/${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ matrix.service }}:sha-${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push approved images
        env:
          SERVICE: ${{ matrix.service }}
          LOCAL_IMAGE: local/${{ matrix.service }}:sha-${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          COMMIT_TAG: sha-${{ github.sha }}
          VERSION_TAG: v0.10.6
        run: |
          docker tag "$LOCAL_IMAGE" "$DOCKERHUB_USERNAME/$SERVICE:$COMMIT_TAG"
          docker tag "$LOCAL_IMAGE" "$DOCKERHUB_USERNAME/$SERVICE:$VERSION_TAG"

          docker push "$DOCKERHUB_USERNAME/$SERVICE:$COMMIT_TAG"
          docker push "$DOCKERHUB_USERNAME/$SERVICE:$VERSION_TAG"

  update-gitops-manifests:
    name: Update Kubernetes image tags
    needs: build-scan-push
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update all service image tags
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        working-directory: k8s/base
        run: |
          kustomize edit set image \
            adservice=joshv69517/adservice:$IMAGE_TAG \
            cartservice=joshv69517/cartservice:$IMAGE_TAG \
            checkoutservice=joshv69517/checkoutservice:$IMAGE_TAG \
            currencyservice=joshv69517/currencyservice:$IMAGE_TAG \
            emailservice=joshv69517/emailservice:$IMAGE_TAG \
            frontend=joshv69517/frontend:$IMAGE_TAG \
            loadgenerator=joshv69517/loadgenerator:$IMAGE_TAG \
            paymentservice=joshv69517/paymentservice:$IMAGE_TAG \
            productcatalogservice=joshv69517/productcatalogservice:$IMAGE_TAG \
            recommendationservice=joshv69517/recommendationservice:$IMAGE_TAG \
            shippingservice=joshv69517/shippingservice:$IMAGE_TAG

      - name: Commit and push manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/base/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git commit -m "chore(gitops): update images to sha-${GITHUB_SHA}"
          git push origin HEAD:master
