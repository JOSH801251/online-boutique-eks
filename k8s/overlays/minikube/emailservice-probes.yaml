apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice
spec:
  template:
    spec:
      containers:
        - name: server
          startupProbe:
            grpc:
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          livenessProbe:
            grpc:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            grpc:
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3