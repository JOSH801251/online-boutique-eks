apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: online-boutique
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/JOSH801251/online-boutique-eks.git
    targetRevision: master
    path: k8s/overlays/minikube

  destination:
    server: https://kubernetes.default.svc
    namespace: online-boutique

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true